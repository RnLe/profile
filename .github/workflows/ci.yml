# Verification pipeline (§104). Inert until pushed; runs on PRs and protected
# pushes. External link checking is deliberately NOT here; it runs in manual
# release verification to avoid network flakiness.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test:unit

      - name: Registry validation
        run: pnpm check:content && pnpm check:claims && pnpm check:media && pnpm check:privacy && pnpm check:documents

      - name: Staging sentinel proof
        run: |
          touch static-public-source/CI-SENTINEL.txt
          if pnpm prepare:public; then
            echo "::error::unregistered file was NOT rejected by prepare:public"
            exit 1
          fi
          rm static-public-source/CI-SENTINEL.txt

      - run: pnpm build

      - run: pnpm check:html

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - run: pnpm test:a11y

      - run: pnpm check:links

      - run: pnpm budget

      - run: pnpm inspect:dist

      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
