# Tracked public project registry: repository visibility, source-link
# permission, and provenance gates for PUBLIC projects only. Pending private
# candidates are never listed here (owner-only audit material lives outside the
# tracked tree). Placement, lifecycle, evidence, status, and copy live in the
# content entries; this registry never duplicates them.
