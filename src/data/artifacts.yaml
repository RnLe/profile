# Artifact (document) registry: versioned records behind the staged
# document CTA. A record renders ONLY when publication is `public` AND its file
# exists under material/publication-source/ with matching sha256 + bytes
# (verified by prepare:public and validate-documents).
#
# Thesis taxonomy (immutable rules):
#   msc-submitted-2026        official-submission: the exact examined artifact
#   msc-reader-v1-1           presentation-corrected: layout/typography only,
#                             requires a human-reviewed scientific-diff receipt
#   msc-research-continuation research-continuation: post-submission research,
#                             never labeled as the examined thesis
#   msc-manuscript            independent-manuscript: declares its source version
#   msc-slides                historical-presentation
records:
  - id: cv
    title: Academic CV
    kind: cv
    version: '2026-09'
    publication: draft
    academicStatus: not-applicable
    resultChanges: false
    date: '2026-08-30'
    description: Research-focused curriculum vitae in English.

  - id: msc-submitted-2026
    title: 'Photonic Band Theory of Moiré Crystals: A Two-Scale Approach'
