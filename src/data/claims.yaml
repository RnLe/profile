    project_id: facial-emotion-recognition
    claim_type: negative-result
    publication_policy: scoped
    short_copy: >-
      In the setting where grokking was shown on images (Omnigrok), a simple
      CNN on 1,000 training faces generalised late in every run: validation
      accuracy rose by up to 11 points long after training accuracy reached
      100%, half of the rise coming 11 to 19 times later. The rise was gradual,
      never the sudden jump of grokking. Neural collapse fell tenfold during
