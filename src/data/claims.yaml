# Claim registry: every numerical, comparative, novelty, status, and
# retraction-sensitive statement the site may (or may not) render.
# Components never hard-code quantitative prose; they reference claim_ids.
#
# evidence_state: draft | prospective | provisional | verified | released | superseded | retracted
# publication_policy: allowed | scoped | project-only | forbidden
# Rules enforced by scripts/validate-claims.ts:
#   - result/comparison claims on 'home' require verified|released
#   - result/comparison claims need measurement_context unless draft/prospective
#   - retracted claims must be policy 'forbidden' with empty allowed_surfaces
claims:
  - claim_id: BLAZE-SCOPE-001
    project_id: blaze2d
    claim_type: scope
    publication_policy: scoped
    short_copy: >-
      Blaze2D solves the two decoupled 2D polarizations (TE/TM) of the Maxwell
      eigenproblem with a plane-wave basis; 3D and slab geometries are
      deliberately out of scope.
    scope: 2D TE/TM only; documented scope boundary.
    evidence_state: released
    model_or_artifact_version: blaze2d 0.6.0
    measurement_context: ''
    last_verified: '2026-08-30'
    allowed_surfaces: [home, research-index, project, metadata]
    notes: Scope statement doubles as the honest limitation.

  - claim_id: BLAZE-MPB-001
    project_id: blaze2d
    claim_type: comparison
    publication_policy: scoped
    short_copy: >-
      Validated against MPB under documented matched conditions: eigenvalues
      agree with MPB reference band structures to a median relative deviation
      of about 1e-4, and the mixed-precision path differs from full f64 by
      about 1e-7.
    scope: >-
      Accuracy comparison only, on the benchmark configurations published with
      the repository (canonical square and hexagonal lattices, resolution 64,
      lowest eight bands).
    evidence_state: verified
    model_or_artifact_version: blaze2d 0.6.0
    measurement_context: >-
      Comparator: MIT MPB. Matched crystal, resolution, band count, and
      tolerance settings; configurations and scripts published with the
      repository.
    source_urls: ['https://github.com/RnLe/blaze2d']
    last_verified: '2026-08-30'
    allowed_surfaces: [home, research-index, project]
    notes: The validation statement for the flagship feature.

  - claim_id: BLAZE-SPEED-001
    project_id: blaze2d
    claim_type: comparison
    publication_policy: scoped
    short_copy: >-
      In recorded 16-thread parameter sweeps, Blaze in mixed precision is about
      an order of magnitude faster than MPB (8.7 to 14.9 times across four
      configurations).
    scope: >-
      Historical runs from the technical report: square and triangular
      lattices, TM and TE, 64 × 64 grid, eight bands; MPB threads each solve,
      Blaze runs independent configurations in parallel. The runs do not record
      tolerances or hardware, and a comparison at equal accuracy is still to
      come.
    evidence_state: provisional
    model_or_artifact_version: blaze2d 0.6.0
    measurement_context: >-
      Mean time per configuration from the Blaze2D website's
      benchmarks/multi-core.json (16 threads): MPB with native threading
      against Blaze scheduling independent configurations, in mixed and in full
      precision. Single-core runs show a smaller ratio (about 2.9 times in the
      report).
    source_urls: ['https://rnle.github.io/blaze2d/blaze']
    last_verified: '2026-09-29'
    allowed_surfaces: [project]
    notes: >-
      Owner decision on 2026-09-29: the order-of-magnitude statement runs in
      the Blaze2D lead, introduction, novelty note, and MPB section, with the
      workload and threading in the speed figure's caption. The benchmark
      audit stays open.

