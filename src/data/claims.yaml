  - claim_id: RIR-CONTROLMODE-001
    project_id: recover-in-real-time
    claim_type: limitation
    publication_policy: allowed
    short_copy: >-
      All current robot media show the assembled platform under leader–follower
      teleoperation; none of it is autonomous execution.
    evidence_state: verified
    last_verified: '2026-08-30'
    allowed_surfaces: [home, research-index, project, metadata]

  - claim_id: BA-MC-001
    project_id: swarm-dynamics
    claim_type: scope
    publication_policy: scoped
    short_copy: >-
      The uniformly subsampled Cartesian alignment mean is a Monte Carlo
      estimator of the full Vicsek alignment vector; the final normalized
      angular update is not claimed to be unbiased.
    scope: Estimator statement applies to the Cartesian mean only.
    evidence_state: verified
    model_or_artifact_version: bachelor-thesis-2023
    last_verified: '2026-08-30'
    allowed_surfaces: [research-index, project]

  - claim_id: BA-CONV-001
    project_id: swarm-dynamics
    claim_type: result
    publication_policy: scoped
    short_copy: >-
      From k = 1 to k = 6, the mean squared deviation of the order parameter
      from the metric Vicsek reference falls by more than an order of
      magnitude, roughly as a power law in k (fitted log-log slopes between
      −1.55 and −1.93); at k = 6 the two models are practically
      indistinguishable in this observable.
    scope: >-
      The alignment order parameter as a function of noise, at density 4, for
      system sizes up to N = 1600. No claim of general equivalence.
    evidence_state: verified
    measurement_context: >-
      Mean squared deviation of the order parameter v_a over the evaluated
      noise values between the metric-topological model and a self-generated
      metric Vicsek reference, per system size (N = 40, 100, 400, 1600) and
      k = 1 to 6, with a linear fit in log-log space; thesis and manuscript,
      figure "MSE vs k".
    model_or_artifact_version: bachelor-thesis-2023
    last_verified: '2026-09-29'
    allowed_surfaces: [research-index, project]

  - claim_id: BA-MARL-001
    project_id: swarm-dynamics
    claim_type: negative-result
    publication_policy: allowed
    short_copy: >-
      The actor–critic multi-agent RL pipeline ran end to end, but training a
      policy that reproduces flocking remained unsuccessful.
    evidence_state: verified
    model_or_artifact_version: bachelor-thesis-2023
    last_verified: '2026-08-30'
    allowed_surfaces: [home, research-index, project]
    notes: Shown before the fine print, not hidden behind an architecture figure.
