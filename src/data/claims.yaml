  - claim_id: MSL-CONV-001
    project_id: envelope-approximation
    claim_type: result
    publication_policy: scoped
    short_copy: >-
      On a smooth, weakly coupled crystal, the registry-adapted frame lowers
      the error about fifteenfold; with the second layer scaled as η², the
      error falls roughly as η^3.8 and the model agrees with both full-Maxwell
      references to about 8 × 10⁻⁷ in frequency.
    scope: >-
      The η^3.8 rate belongs to the scaled weak-coupling family; at fixed
      material both frames reach an error floor.
    evidence_state: verified
    measurement_context: >-
      Envelope eigenvalue error against plane-wave and FDFD references on the
      same dielectric and declared band domain; second edition, Figure 44.
    last_verified: '2026-09-29'
    allowed_surfaces: [project]

  - claim_id: MSL-STATES-001
    project_id: envelope-approximation
    claim_type: result
    publication_policy: scoped
    short_copy: >-
      At 0.607°, where a supercell holds 8,911 microscopic cells, the
      exact-frame envelope model matches all 51 states of a declared domain,
      with frequency differences of 4.7 × 10⁻⁸ to 8.1 × 10⁻⁸, comparable to the
      reference's own numerical error.
    scope: One weak-coupling valley domain; the fixed-frame model fails the full state count.
    evidence_state: verified
    measurement_context: >-
      State-by-state matching against an FDFD reference within a domain
      declared in advance; second edition, Figure 47.
    last_verified: '2026-09-29'
    allowed_surfaces: [project]

