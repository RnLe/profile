  - claim_id: RIR-HW-001
    project_id: recover-in-real-time
    claim_type: status
    publication_policy: scoped
    short_copy: >-
      A Waveshare SO-ARM101 SE leader–follower pair is assembled and
      calibrated; teleoperation has been demonstrated under the recorded
