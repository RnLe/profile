# Claim registry: every numerical, comparative, novelty, status, and
# retraction-sensitive statement the site may (or may not) render.
# Components never hard-code quantitative prose; they reference claim_ids.
#
# evidence_state: draft | prospective | provisional | verified | released | superseded | retracted
# publication_policy: allowed | scoped | project-only | forbidden
# Rules enforced by scripts/validate-claims.ts:
#   - result/comparison claims on 'home' require verified|released
#   - result/comparison claims need measurement_context unless draft/prospective
#   - retracted claims must be policy 'forbidden' with empty allowed_surfaces
claims:
  - claim_id: BLAZE-SCOPE-001
    project_id: blaze2d
    claim_type: scope
    publication_policy: scoped
    short_copy: >-
      Blaze2D solves the two decoupled 2D polarizations (TE/TM) of the Maxwell
      eigenproblem with a plane-wave basis; 3D and slab geometries are
      deliberately out of scope.
    scope: 2D TE/TM only; documented scope boundary.
    evidence_state: released
    model_or_artifact_version: blaze2d 0.6.0
    measurement_context: ''
    last_verified: '2026-08-30'
    allowed_surfaces: [home, research-index, project, metadata]
    notes: Scope statement doubles as the honest limitation.

  - claim_id: BLAZE-MPB-001
    project_id: blaze2d
    claim_type: comparison
    publication_policy: scoped
    short_copy: >-
      Validated against MPB under documented matched conditions: eigenvalues
      agree with MPB reference band structures to a median relative deviation
      of about 1e-4, and the mixed-precision path differs from full f64 by
      about 1e-7.
    scope: >-
      Accuracy comparison only, on the benchmark configurations published with
      the repository (canonical square and hexagonal lattices, resolution 64,
      lowest eight bands).
    evidence_state: verified
    model_or_artifact_version: blaze2d 0.6.0
    measurement_context: >-
      Comparator: MIT MPB. Matched crystal, resolution, band count, and
      tolerance settings; configurations and scripts published with the
      repository.
    source_urls: ['https://github.com/RnLe/blaze2d']
    last_verified: '2026-08-30'
    allowed_surfaces: [home, research-index, project]
    notes: The validation statement for the flagship feature.

  - claim_id: BLAZE-SPEED-001
    project_id: blaze2d
    claim_type: comparison
    publication_policy: scoped
    short_copy: >-
      In recorded 16-thread parameter sweeps, Blaze in mixed precision is about
      an order of magnitude faster than MPB (8.7 to 14.9 times across four
      configurations).
    scope: >-
      Historical runs from the technical report: square and triangular
      lattices, TM and TE, 64 × 64 grid, eight bands; MPB threads each solve,
      Blaze runs independent configurations in parallel. The runs do not record
      tolerances or hardware, and a comparison at equal accuracy is still to
      come.
    evidence_state: provisional
    model_or_artifact_version: blaze2d 0.6.0
    measurement_context: >-
      Mean time per configuration from the Blaze2D website's
      benchmarks/multi-core.json (16 threads): MPB with native threading
      against Blaze scheduling independent configurations, in mixed and in full
      precision. Single-core runs show a smaller ratio (about 2.9 times in the
      report).
    source_urls: ['https://rnle.github.io/blaze2d/blaze']
    last_verified: '2026-09-29'
    allowed_surfaces: [project]
    notes: >-
      Owner decision on 2026-09-29: the order-of-magnitude statement runs in
      the Blaze2D lead, introduction, novelty note, and MPB section, with the
      workload and threading in the speed figure's caption. The benchmark
      audit stays open.

  - claim_id: BLAZE-GPU-001
    project_id: blaze2d
    claim_type: status
    publication_policy: project-only
    short_copy: >-
      A CUDA backend exists in the workspace; the tuned, validated paths are
      CPU. GPU acceleration is identified future work, not a qualified backend.
    evidence_state: prospective
    last_verified: '2026-08-30'
    allowed_surfaces: [project]
    notes: No speculative GPU multipliers anywhere.

  - claim_id: BLAZE-SCALE-001
    project_id: blaze2d
    claim_type: status
    publication_policy: allowed
    short_copy: >-
      As of September 2026, Blaze2D has 50,399 lines of Rust in 8 workspace
      crates, 663 automated tests (525 in Rust, 100 in Python, 38 in the
      browser), 17,636 lines of TypeScript for the website and the Workbench,
      and 443 commits since November 2025.
    evidence_state: verified
    measurement_context: >-
      Counted in the Blaze2D working tree on 2026-09-29: cloc code lines (no
      blanks or comments) over tracked files, test functions (Rust #[test],
      Python test_*, the website's browser tests), and commits in the history.
      Rendered from src/data/blaze-scale.ts.
    last_verified: '2026-09-29'
    allowed_surfaces: [project]

  - claim_id: MSL-THESIS-001
    project_id: envelope-approximation
    claim_type: status
    publication_policy: allowed
    short_copy: >-
      The submitted thesis developed a multiband two-scale envelope approach
      for photonic moiré crystals, supported by a substantial Rust/Python/WASM
      research pipeline.
    evidence_state: verified
    model_or_artifact_version: msc-submitted-2026
    last_verified: '2026-08-30'
    allowed_surfaces: [home, research-index, project, cv, metadata]

  - claim_id: MSL-CONT-001
    project_id: envelope-approximation
    claim_type: status
    publication_policy: scoped
    short_copy: >-
      After submission, an audit exposed invalid comparisons in the submitted
      validation. The second edition (September 2026) corrects the derivation
      and rebuilds the validation as state-by-state comparisons against
      independent full-Maxwell references.
    scope: >-
      Disclose the audit and its correction without dramatization; earlier
      claims are version-specific, and the second edition is not the examined
      thesis.
    evidence_state: verified
    last_verified: '2026-09-29'
    allowed_surfaces: [home, research-index, project]
    notes: The transparent-correction statement. A portfolio strength, not a footnote.

  - claim_id: MSL-COST-001
    project_id: envelope-approximation
    claim_type: status
    publication_policy: scoped
    short_copy: >-
      A full finite-difference reference at 2.01° needed about 3.3 million
      unknowns and about 54 minutes (3,221 seconds); the next commensurate
      cell, at 1.01°, needed about 13 million unknowns and did not fit in
      memory.
    scope: The revised square-bilayer study of the second edition, on one workstation.
    evidence_state: verified
    measurement_context: >-
      FDFD reference solves of the square rod bilayer, second edition of the
      thesis; reported on the Blaze2D thesis page.
    last_verified: '2026-09-29'
    allowed_surfaces: [project]

  - claim_id: MSL-CONV-001
    project_id: envelope-approximation
    claim_type: result
    publication_policy: scoped
    short_copy: >-
      On a smooth, weakly coupled crystal, the registry-adapted frame lowers
      the error about fifteenfold; with the second layer scaled as η², the
      error falls roughly as η^3.8 and the model agrees with both full-Maxwell
      references to about 8 × 10⁻⁷ in frequency.
    scope: >-
      The η^3.8 rate belongs to the scaled weak-coupling family; at fixed
      material both frames reach an error floor.
    evidence_state: verified
    measurement_context: >-
      Envelope eigenvalue error against plane-wave and FDFD references on the
      same dielectric and declared band domain; second edition, Figure 44.
    last_verified: '2026-09-29'
    allowed_surfaces: [project]

  - claim_id: MSL-STATES-001
    project_id: envelope-approximation
    claim_type: result
    publication_policy: scoped
    short_copy: >-
      At 0.607°, where a supercell holds 8,911 microscopic cells, the
      exact-frame envelope model matches all 51 states of a declared domain,
      with frequency differences of 4.7 × 10⁻⁸ to 8.1 × 10⁻⁸, comparable to the
      reference's own numerical error.
    scope: One weak-coupling valley domain; the fixed-frame model fails the full state count.
    evidence_state: verified
    measurement_context: >-
      State-by-state matching against an FDFD reference within a domain
      declared in advance; second edition, Figure 47.
    last_verified: '2026-09-29'
    allowed_surfaces: [project]

  - claim_id: MSL-STRONG-001
    project_id: envelope-approximation
    claim_type: limitation
    publication_policy: allowed
    short_copy: >-
      On the strongly coupled square rod bilayer, the model brings the lowest
      state close to the full-wave references and reaches 0.50°, where the full
      calculation did not fit in memory; higher groups of four symmetry-related
      states come out split, pending a symmetry-respecting gauge.
    evidence_state: verified
    last_verified: '2026-09-29'
    allowed_surfaces: [project]

  - claim_id: MSL-MAGIC-070
    project_id: envelope-approximation
    claim_type: restriction
    publication_policy: forbidden
    short_copy: >-
      RETRACTED. The approximately 0.7-degree "magic-angle" flat-band result
      and the unqualified quadratic bandwidth-scaling conclusion were artifacts
      of a numerical floor in the submitted validation.
    evidence_state: retracted
    last_verified: '2026-08-30'
    allowed_surfaces: []
    forbidden_surfaces: [home, research-index, project, cv, metadata]
    forbidden_phrases:
      - 'magic angle'
      - 'magic-angle'
      - "0.7°"
      - '0.7 degrees'
      - 'confirms the predicted quadratic bandwidth scaling'
    notes: >-
      Must never render anywhere, including metadata, alt text, and Open Graph
      descriptions. inspect:dist enforces forbidden_phrases against the built
      artifact.

  - claim_id: GR-NOVELTY-001
    project_id: grounded-recovery
    claim_type: limitation
    publication_policy: allowed
    short_copy: >-
      Grounded Recovery builds on established DAgger, recovery, and
      intervention-learning ideas; no algorithmic novelty is claimed.
    evidence_state: verified
    last_verified: '2026-09-25'
    allowed_surfaces: [home, research-index, project]

  - claim_id: GR-PRIMARY-001
    project_id: grounded-recovery
    claim_type: result
    publication_policy: scoped
    short_copy: >-
      Corrections beat extra demonstrations by +14.3 percentage points in task
      success (95% interval +10.0 to +18.6), in all six independent runs, on 536
      held-out mazes with an action change not used in training.
    scope: >-
      One small simulated maze task with a scripted expert and three actions,
      1,000 extra labels per method in each run, and a test protocol fixed
      before the test set was opened once. Not a result about robots,
      reinforcement learning, or human teachers.
    evidence_state: verified
    measurement_context: >-
      Mean paired difference in intention-to-treat task success on the 536
      eligible scenarios with the unseen action corruption, recovery
      aggregation minus extra demonstrations, over six pipeline bundles; 95%
      paired t interval. Every per-bundle difference is positive.
    source_paths: [public_result/experiment-summary.json]
    source_urls:
      - 'https://github.com/RnLe/recovery-policy-learning/blob/c4fc791c80b455cf374fef6e117580cd18c89434/public_result/experiment-summary.json'
    source_commit: c4fc791c80b455cf374fef6e117580cd18c89434
    artifact_sha256: 219044c2c03f3f64fe84974dcf9eb52bb330877e1a582ae78c832cfa57fc7c2e
    last_verified: '2026-09-25'
    allowed_surfaces: [research-index, project]

  - claim_id: GR-COST-001
    project_id: grounded-recovery
    claim_type: limitation
    publication_policy: allowed
    short_copy: >-
      Only the number of labels was matched: across the six runs, collecting
      the corrections took 38,109 expert queries, the extra demonstrations
      6,000.
    evidence_state: verified
    source_paths: [public_result/experiment-summary.json]
    source_commit: c4fc791c80b455cf374fef6e117580cd18c89434
    artifact_sha256: 219044c2c03f3f64fe84974dcf9eb52bb330877e1a582ae78c832cfa57fc7c2e
    last_verified: '2026-09-25'
    allowed_surfaces: [research-index, project]

  - claim_id: GR-SECONDARY-001
    project_id: grounded-recovery
    claim_type: result
    publication_policy: scoped
    short_copy: >-
      Mean success of the original agent, extra demonstrations, and
      corrections: 76.3%, 80.3%, and 86.1% with no action change; 66.9%,
      72.5%, and 85.7% with a familiar change; 65.8%, 70.2%, and 84.5% with a
      new change. Only the new-change comparison was fixed in advance.
    scope: >-
      The no-change and familiar-change comparisons are secondary and were not
      prespecified; the same six runs and 536 scenarios as GR-PRIMARY-001.
    evidence_state: verified
    measurement_context: >-
      Mean intention-to-treat success over six pipeline bundles per arm and
      slice (clean, matched, unseen); shown on the study page's success chart.
    source_paths: [public_result/experiment-summary.json]
    source_urls:
      - 'https://github.com/RnLe/recovery-policy-learning/blob/c4fc791c80b455cf374fef6e117580cd18c89434/public_result/experiment-summary.json'
    source_commit: c4fc791c80b455cf374fef6e117580cd18c89434
    artifact_sha256: 219044c2c03f3f64fe84974dcf9eb52bb330877e1a582ae78c832cfa57fc7c2e
    last_verified: '2026-09-25'
    allowed_surfaces: [research-index, project]

  - claim_id: RW-STATUS-001
    project_id: residual-worlds
    claim_type: status
    publication_policy: allowed
    short_copy: >-
      Simulator and preregistered protocol are being implemented; calibration
      and protected evaluation are pending.
    evidence_state: verified
    last_verified: '2026-08-30'
    allowed_surfaces: [home, research-index, project]

  - claim_id: RW-PRIMARY-001
    project_id: residual-worlds
    claim_type: result
